[project]
name = "nyc-taxi-demand-predictor"
version = "0.1.0"
description = ""
authors = [
    {name = "Nima Mafi",email = "nima.mafi92@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "jupyter (>=1.1.1,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pandas (>=2.3.3,<2.4)",
    "pyarrow (>=25.0.0,<26.0.0)",
    "tqdm (>=4.70.1,<5.0.0)",
    "plotly (>=7.1.0,<8.0.0)",
    "numpy (>=2.4,<2.5)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "xgboost (>=3.4.1,<4.0.0)",
    "lightgbm (>=4.7.0,<5.0.0)",
    "optuna (>=5.0.0,<6.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "hopsworks[python] (==5.2.3)",
]

[tool.poetry]
packages = [{include = "nyc_taxi_demand_predictor", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
